<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학업여지도 파트너센터 | 로그인 및 회원가입</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-focus: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 16px 36px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .auth-header {
            padding: 32px 28px 20px;
            text-align: center;
            background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.2px;
            margin-bottom: 12px;
        }

        .auth-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 13.5px;
            color: var(--text-sub);
            line-height: 1.5;
            word-break: keep-all;
        }

        .tab-nav {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin: 20px 24px 0;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .tab-content {
            padding: 24px 28px 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font-size: 14.5px;
            color: var(--text-main);
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-size: 14px;
        }

        .pw-toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .pw-toggle-btn:hover {
            color: #475569;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .radio-card {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            background: #ffffff;
        }

        .radio-card input[type="radio"] {
            display: none;
        }

        .radio-card.active {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
            font-weight: 700;
        }

        .radio-card .icon {
            font-size: 18px;
        }

        .radio-card .label-text {
            font-size: 13.5px;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.32);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }


        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .toast-banner {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- 상단 헤더 -->
        <div class="auth-header">
            <div class="brand-badge">
                <span>🤝</span>
                <span>학업여지도 파트너스</span>
            </div>
            <h1 id="pageTitle">파트너센터 로그인</h1>
            <p id="pageDesc">학원 및 부동산 사업자 회원 전용 콘솔입니다.<br>로그인 또는 회원가입 후 파트너 서비스를 이용하세요.</p>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="tab-nav">
            <button type="button" id="tabBtnLogin" class="tab-btn active" onclick="switchAuthTab('login')">파트너 로그인</button>
            <button type="button" id="tabBtnRegister" class="tab-btn" onclick="switchAuthTab('register')">파트너 회원가입</button>
        </div>

        <!-- [탭 1] 파트너 로그인 화면 -->
        <div id="viewLogin" class="tab-content" style="display: block;">
            <form id="partnerLoginForm" onsubmit="handlePartnerLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">아이디 (이메일 주소)</label>
                    <div class="input-wrap">
                        <input type="email" id="loginEmail" class="form-input" required placeholder="partner@example.com" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">비밀번호</label>
                    <div class="input-wrap">
                        <input type="password" id="loginPassword" class="form-input" required placeholder="비밀번호 입력" autocomplete="current-password">
                        <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="비밀번호 보기">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12.5px;">
                    <label style="display: flex; align-items: center; gap: 6px; color: #475569; cursor: pointer;">
                        <input type="checkbox" id="chkRememberMe" checked style="accent-color: #2563eb;">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="/" style="color: #64748b; text-decoration: none;">메인 홈 이동</a>
                </div>

                <button type="submit" id="btnSubmitLogin" class="btn-submit">
                    <span>파트너센터 로그인</span>
                    <span style="font-size: 14px;">➔</span>
                </button>
            </form>


        </div>

        <!-- [탭 2] 파트너 회원가입 화면 -->
        <div id="viewRegister" class="tab-content" style="display: none;">
            <form id="partnerRegisterForm" onsubmit="handlePartnerRegister(event)">
                <div class="form-group">
                    <label>사업자 유형 <span class="required">*</span></label>
                    <div class="radio-grid">
                        <label class="radio-card active" id="typeAcademyCard">
                            <input type="radio" name="bizType" value="academy" checked onchange="updateBizTypeUi('academy')">
                            <span class="icon">🏫</span>
                            <span class="label-text">학원 / 교습소</span>
                        </label>
                        <label class="radio-card" id="typeRealEstateCard">
                            <input type="radio" name="bizType" value="real_estate" onchange="updateBizTypeUi('real_estate')">
                            <span class="icon">🏢</span>
                            <span class="label-text">공인중개사</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regBizName">상호명 (학원명 / 부동산명) <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="text" id="regBizName" class="form-input" required placeholder="예: 삼송 올림피아드 수학학원">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regName">대표자 성명 <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="text" id="regName" class="form-input" required placeholder="홍길동 대표">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">아이디 (이메일 주소) <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="email" id="regEmail" class="form-input" required placeholder="partner@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPhone">대표 연락처 <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="tel" id="regPhone" class="form-input" required placeholder="010-1234-5678 또는 02-1234-5678">
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">비밀번호 (6자 이상) <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="regPassword" class="form-input" required placeholder="비밀번호 입력 (6자 이상)" minlength="6">
                        <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)" title="비밀번호 보기">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPasswordConfirm">비밀번호 확인 <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="regPasswordConfirm" class="form-input" required placeholder="비밀번호 재입력">
                    </div>
                </div>

                <div style="margin-top: 12px; margin-bottom: 6px; font-size: 12px; color: #64748b; line-height: 1.5;">
                    <label style="display: flex; align-items: flex-start; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="chkTerms" required checked style="margin-top: 2px; accent-color: #2563eb;">
                        <span>[필수] 파트너 센터 서비스 이용약관 및 개인정보 처리방침에 동의합니다.</span>
                    </label>
                </div>

                <button type="submit" id="btnSubmitRegister" class="btn-submit">
                    <span>파트너 가입 완료 & 센터 시작</span>
                    <span style="font-size: 14px;">➔</span>
                </button>
            </form>
        </div>
    </div>

    <!-- 하단 메인 바로가기 -->
    <div class="auth-footer">
        <span>일반 학부모 회원이신가요? </span>
        <a href="/">학업여지도 메인 지도로 이동</a>
    </div>

    <!-- 토스트 안내 -->
    <div id="toastBanner" class="toast-banner">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMsg">알림 메시지</span>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect') || '/business';

        // 탭 전환 처리
        function switchAuthTab(tab) {
            const btnLogin = document.getElementById('tabBtnLogin');
            const btnRegister = document.getElementById('tabBtnRegister');
            const viewLogin = document.getElementById('viewLogin');
            const viewRegister = document.getElementById('viewRegister');
            const titleEl = document.getElementById('pageTitle');
            const descEl = document.getElementById('pageDesc');

            if (tab === 'register') {
                btnLogin.classList.remove('active');
                btnRegister.classList.add('active');
                viewLogin.style.display = 'none';
                viewRegister.style.display = 'block';
                titleEl.innerText = '파트너 회원가입';
                descEl.innerHTML = '간편 가입 후 사업자 등록 및<br>학업여지도 공식 파트너십을 시작하세요.';
            } else {
                btnRegister.classList.remove('active');
                btnLogin.classList.add('active');
                viewRegister.style.display = 'none';
                viewLogin.style.display = 'block';
                titleEl.innerText = '파트너센터 로그인';
                descEl.innerHTML = '학원 및 부동산 사업자 회원 전용 콘솔입니다.<br>로그인 또는 회원가입 후 파트너 서비스를 이용하세요.';
            }
        }

        // 비밀번호 표시 토글
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            ` : `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }

        // 사업자 유형 라디오 선택 UI 업데이트
        function updateBizTypeUi(type) {
            const acadCard = document.getElementById('typeAcademyCard');
            const realCard = document.getElementById('typeRealEstateCard');
            const bizNameInput = document.getElementById('regBizName');

            if (type === 'real_estate') {
                acadCard.classList.remove('active');
                realCard.classList.add('active');
                if (bizNameInput) bizNameInput.placeholder = '예: 원탑 공인중개사사무소';
            } else {
                realCard.classList.remove('active');
                acadCard.classList.add('active');
                if (bizNameInput) bizNameInput.placeholder = '예: 삼송 올림피아드 수학학원';
            }
        }

        // 토스트 메시지 띄우기
        function showToast(msg, icon = 'ℹ️') {
            const toast = document.getElementById('toastBanner');
            document.getElementById('toastIcon').innerText = icon;
            document.getElementById('toastMsg').innerText = msg;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }


        // 로그인 처리 핸들러
        async function handlePartnerLogin(e) {
            if (e && e.preventDefault) e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnSubmitLogin');

            if (!email || !password) {
                showToast('이메일과 비밀번호를 모두 입력해주세요.', '⚠️');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span>로그인 처리 중...</span>';

                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    showToast(data.message || '로그인에 실패했습니다. 계정 정보를 확인해주세요.', '❌');
                    btn.disabled = false;
                    btn.innerHTML = '<span>파트너센터 로그인</span><span style="font-size: 14px;">➔</span>';
                    return;
                }

                // 성공 세션 로컬스토리지 보존
                const user = data.user;
                localStorage.setItem('learnmap_current_user', JSON.stringify(user));
                localStorage.setItem('user', JSON.stringify(user));
                sessionStorage.setItem('learnmap_current_user', JSON.stringify(user));

                showToast(`${user.name || '파트너'}님 환영합니다! 파트너센터로 이동합니다.`, '✅');
                setTimeout(() => {
                    window.location.href = redirectTarget;
                }, 400);

            } catch (err) {
                console.error('로그인 에러:', err);
                showToast('네트워크 오류가 발생했습니다. 다시 시도해주세요.', '❌');
                btn.disabled = false;
                btn.innerHTML = '<span>파트너센터 로그인</span><span style="font-size: 14px;">➔</span>';
            }
        }

        // 회원가입 처리 핸들러
        async function handlePartnerRegister(e) {
            if (e && e.preventDefault) e.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const bizName = document.getElementById('regBizName').value.trim();
            const bizType = document.querySelector('input[name="bizType"]:checked')?.value || 'academy';
            const btn = document.getElementById('btnSubmitRegister');

            if (!name || !email || !phone || !password || !bizName) {
                showToast('모든 필수 항목을 입력해주세요.', '⚠️');
                return;
            }

            if (password.length < 6) {
                showToast('비밀번호는 최소 6자 이상이어야 합니다.', '⚠️');
                return;
            }

            if (password !== passwordConfirm) {
                showToast('비밀번호가 일치하지 않습니다.', '⚠️');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span>가입 처리 및 사업자 연동 중...</span>';

                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        phone,
                        role: 'partner',
                        bizName,
                        bizType
                    })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    showToast(data.message || '회원가입에 실패했습니다.', '❌');
                    btn.disabled = false;
                    btn.innerHTML = '<span>파트너 가입 완료 & 센터 시작</span><span style="font-size: 14px;">➔</span>';
                    return;
                }

                // 가입 성공 후 즉시 로그인 처리
                const sessionUser = data.user || { name, email, role: 'partner' };
                localStorage.setItem('learnmap_current_user', JSON.stringify(sessionUser));
                localStorage.setItem('user', JSON.stringify(sessionUser));
                sessionStorage.setItem('learnmap_current_user', JSON.stringify(sessionUser));

                showToast('파트너 회원가입이 완료되었습니다! 파트너센터로 이동합니다.', '🎉');
                setTimeout(() => {
                    window.location.href = redirectTarget;
                }, 500);

            } catch (err) {
                console.error('회원가입 에러:', err);
                showToast('가입 처리 중 오류가 발생했습니다.', '❌');
                btn.disabled = false;
                btn.innerHTML = '<span>파트너 가입 완료 & 센터 시작</span><span style="font-size: 14px;">➔</span>';
            }
        }

        // 초기 URL 쿼리 파라미터 체크 (예: ?tab=register)
        window.addEventListener('DOMContentLoaded', () => {
            const tabParam = urlParams.get('tab');
            if (tabParam === 'register') {
                switchAuthTab('register');
            }
        });
    </script>
</body>
</html>
